name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The differential tests are validated against this QEMU; distribution packages are older
      # and disagree with it (Ubuntu 24.04's 8.2 reports mismatches and can crash in TCG).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libglib2.0-dev libpixman-1-dev python3-venv flex bison

      - name: Cache QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: qemu-11.1.2-${{ runner.os }}

      - name: Build QEMU 11.1.2
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://download.qemu.org/qemu-11.1.2.tar.xz | tar -xJ
          cd qemu-11.1.2
          ./configure --prefix="$HOME/qemu" --target-list=i386-softmmu,x86_64-softmmu \
            --disable-docs --disable-tools --disable-user
          make -j"$(nproc)" install

      - name: Add QEMU to PATH
        run: |
          echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
          "$HOME/qemu/bin/qemu-system-i386" --version

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            x86_32/.lake
            x86_64/.lake
            validation/.lake
            suites/openssl/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lean-toolchain') }}-${{ hashFiles('**/*.lean', '**/lakefile.toml') }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lean-toolchain') }}-

      - name: Verify (models, proofs, runners, QEMU differential tests)
        run: ./verify.sh 2000

      # The task images are rebuilt from source with the pinned LLVM release (fetched by hash) and
      # must equal the pinned bytes; they are then run on QEMU, and the fuzzer must cover every
      # instruction form they execute.
      - name: Cache pinned LLVM
        uses: actions/cache@v4
        with:
          path: suites/openssl/.toolchain
          key: openssl-suite-llvm-${{ runner.os }}-${{ hashFiles('suites/openssl/tools/toolchain.py') }}

      - name: Install the reference implementations for the specification vectors
        run: |
          python3 -m venv "$HOME/reference"
          "$HOME/reference/bin/pip" install cryptography
          echo "$HOME/reference/bin" >> "$GITHUB_PATH"

      - name: Validate and audit the OpenSSL tasks
        run: suites/openssl/verify.sh --rebuild --hw --reference
