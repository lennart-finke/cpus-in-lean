# Evidence that the model is the IA-32 architecture: the Linux boot runner (`x86run`) and the
# differential-test runner (`x86test`, driven by `test/`). Nothing here is imported by statements or proofs.
name = "validation"
version = "0.1.0"
defaultTargets = ["x86run", "x86test", "x86sys", "x86litmus"]

[[require]]
name = "x86"
path = "../x86_32"

[[lean_exe]]
name = "x86run"
root = "Main"

[[lean_exe]]
name = "x86test"
root = "TestMain"

# All final states of a litmus test on the x86-TSO multiprocessor (`X86.Tso`), driven by `litmus/`.
[[lean_exe]]
name = "x86litmus"
root = "LitmusMain"

[[lean_exe]]
name = "x86sys"
root = "SysMain"

# User-mode IA-32 x87/MMX/SSE/SSE2 hardware validation.
[[lean_exe]]
name = "x86fp"
root = "FpMain"

# Emulation of the 64-bit stubs of the long-mode system test (test/sys/t_long.c), used by x86sys.
[[lean_lib]]
name = "LongStub"
