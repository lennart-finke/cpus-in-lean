# The IA-32 model: the semantics every statement and proof is about (trusted), and theorems about
# the model itself (ALU/flags/shifts/division/paging facts, `X86/Proofs/`).
name = "x86"
version = "0.1.0"
defaultTargets = ["X86", "X86Proofs", "X86Tso"]

[[lean_lib]]
name = "X86"

[[lean_lib]]
name = "X86Proofs"
roots = ["X86.Proofs"]

# The multiprocessor x86-TSO semantics (trusted for concurrent statements) and its theorems. A
# separate root: the single-CPU model, and everything built on it, does not depend on it.
[[lean_lib]]
name = "X86Tso"
roots = ["X86.Tso", "X86.Proofs.Tso"]
