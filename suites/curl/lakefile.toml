name = "curl_tasks"
version = "0.1.0"
defaultTargets = ["Curl", "check"]

# The call harness (`Ssl.Harness`), the test support (`Check.Support`) and, through it, the CPU model.
[[require]]
name = "openssl_tasks"
path = "../openssl"

[[lean_lib]]
name = "Curl"
globs = ["Curl.+"]

[[lean_exe]]
name = "check"
root = "CurlCheck"
