# The IA-32 model: the semantics every statement and proof is about (trusted), and theorems about
# the model itself (ALU/flags/shifts/division/paging facts, `X86/Proofs/`).
name = "x86"
version = "0.1.0"
defaultTargets = ["X86", "X86Proofs"]

[[lean_lib]]
name = "X86"

[[lean_lib]]
name = "X86Proofs"
roots = ["X86.Proofs"]
